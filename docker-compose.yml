services:
  pangolin-cli:
    image: fosrl/pangolin-cli:latest
    container_name: pangolin-cli
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      PANGOLIN_ENDPOINT: "${PANGOLIN_ENDPOINT:?Set PANGOLIN_ENDPOINT}"
      CLIENT_ID: "${PANGOLIN_CLIENT_ID:?Set PANGOLIN_CLIENT_ID}"
      CLIENT_SECRET: "${PANGOLIN_CLIENT_SECRET:?Set PANGOLIN_CLIENT_SECRET}"
    command: ["--override-dns=false"]
    ports:
      - "${LISTEN_ADDR:-127.0.0.1:8080}:8080"

  kvm-console:
    image: ghcr.io/zenyxcloud/kvm-console:latest
    restart: unless-stopped
    network_mode: service:pangolin-cli
    depends_on:
      pangolin-cli:
        condition: service_started
        restart: true
    environment:
      LISTEN_ADDR: ":8080"
      API_KEY: "${API_KEY:?Set API_KEY}"
      WHMCS_IPS: "${WHMCS_IPS:?Set WHMCS_IPS}"
      PVE_ALLOWED_NETWORKS: "${PVE_ALLOWED_NETWORKS:?Set PVE_ALLOWED_NETWORKS}"
      PVE_ALLOWED_PORTS: "${PVE_ALLOWED_PORTS:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      CLIENT_IP_VALIDATE: "${CLIENT_IP_VALIDATE:-}"
      TOKEN_TTL: "${TOKEN_TTL:-}"
      SESSION_MAX_DURATION: "${SESSION_MAX_DURATION:-}"
      PVE_DIAL_TIMEOUT: "${PVE_DIAL_TIMEOUT:-}"
      PING_INTERVAL: "${PING_INTERVAL:-}"
      MAX_PENDING_TOKENS: "${MAX_PENDING_TOKENS:-}"
      MAX_SESSIONS: "${MAX_SESSIONS:-}"
      MAX_SESSIONS_PER_IP: "${MAX_SESSIONS_PER_IP:-}"
      CLIENT_MESSAGE_LIMIT: "${CLIENT_MESSAGE_LIMIT:-}"
      LOG_LEVEL: "${LOG_LEVEL:-}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
